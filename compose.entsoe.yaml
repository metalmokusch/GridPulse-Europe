services:
  app:
    environment:
      GRIDPULSE_DATA_SOURCE: entsoe
      GRIDPULSE_QUALITY_LOG_FILE: /var/lib/gridpulse/quality.jsonl
      GRIDPULSE_QUALITY_INTERVAL_MINUTES: ${GRIDPULSE_QUALITY_INTERVAL_MINUTES:-60}
      ENTSOE_API_TOKEN_FILE: /run/secrets/entsoe_api_token
    volumes:
      - ${GRIDPULSE_DATA_DIR:-./gridpulse-data}:/var/lib/gridpulse
    secrets:
      - entsoe_api_token

secrets:
  entsoe_api_token:
    file: ${ENTSOE_API_TOKEN_FILE:-./secrets/entsoe_api_token}
